- name: FastQC
  subtitle: null
  url: https://www.bioinformatics.babraham.ac.uk/projects/fastqc/
  category: core ngs pipeline
  organization: Babraham Bioinformatics
  summary: A quality control tool for high-throughput sequencing data that generates comprehensive QC
    reports including per-base quality scores, sequence length distribution, adapter contamination, and
    overrepresented sequences. Available as a command-line tool or GUI application with visual HTML reports.
    AI agents can use FastQC to automatically assess data quality before alignment, identify problematic
    samples requiring trimming, and determine optimal preprocessing parameters based on quality metrics.
- name: Trimmomatic
  subtitle: null
  url: http://www.usadellab.org/cms/?page=trimmomatic
  category: core ngs pipeline
  organization: Usadel Lab
  summary: A flexible read trimming tool for Illumina NGS data that performs adapter removal, quality-based
    trimming, and filtering of low-quality reads. Supports paired-end and single-end data with configurable
    parameters for sliding window trimming, minimum length filtering, and quality thresholds. AI agents
    can invoke Trimmomatic to clean raw sequencing data based on FastQC reports, automatically determine
    optimal trimming parameters, and prepare high-quality reads for alignment workflows.
- name: BWA
  subtitle: Burrows-Wheeler Aligner
  url: http://bio-bwa.sourceforge.net/
  category: core ngs pipeline
  organization: Heng Li Lab
  summary: 'A fast and memory-efficient aligner for mapping short DNA sequences (70bp-1Mbp) against large
    reference genomes using the Burrows-Wheeler Transform algorithm. Includes three algorithms: BWA-backtrack
    for reads <100bp, BWA-SW for longer reads, and BWA-MEM (most commonly used) for 70bp-1Mbp sequences
    with superior performance on split alignments. AI agents can use BWA-MEM for whole-genome sequencing
    alignment, automatically select appropriate algorithms based on read length, and generate sorted BAM
    files for variant calling pipelines.'
- name: STAR
  subtitle: Spliced Transcripts Alignment to a Reference
  url: https://github.com/alexdobin/STAR
  category: core ngs pipeline
  organization: Alexander Dobin
  summary: An ultrafast RNA-seq aligner designed to detect splice junctions with high accuracy, achieving
    speeds >100 million reads/hour. Uses suffix array-based mapping with 2-pass alignment mode for improved
    junction detection. Outputs include aligned BAM files, splice junction tables, and gene-level read
    counts. AI agents can execute STAR for transcriptome alignment tasks, automatically configure genome
    indexes, detect novel splice variants, and generate count matrices for differential expression analysis.
- name: Minimap2
  subtitle: null
  url: https://github.com/lh3/minimap2
  category: core ngs pipeline
  organization: Heng Li
  summary: A versatile alignment tool optimized for long-read sequencing data (PacBio, Oxford Nanopore)
    and assembly-to-assembly comparison, supporting read lengths from kilobases to megabases. Features
    include fast all-vs-all alignment, spliced alignment for long-read RNA-seq, and accurate mapping for
    noisy long reads. AI agents can use Minimap2 for long-read genomic/transcriptomic alignment, structural
    variant detection workflows, and rapid comparison of draft genome assemblies.
- name: Samtools
  subtitle: null
  url: http://www.htslib.org/
  category: core ngs pipeline
  organization: Genome Research Ltd
  summary: A comprehensive suite of utilities for manipulating SAM/BAM/CRAM format alignments, providing
    core functionalities including sorting, indexing, merging, filtering, and format conversion. Supports
    parallel processing, CRAM compression (up to 60% size reduction vs BAM), and region-specific data
    extraction. AI agents can invoke Samtools for standard BAM file operations (sort, index, merge, view),
    calculate alignment statistics, extract specific genomic regions, and prepare files for downstream
    variant calling or visualization.
- name: BEDTools
  subtitle: null
  url: https://bedtools.readthedocs.io/
  category: core ngs pipeline
  organization: Quinlan Lab
  summary: A powerful toolset for genome arithmetic operations on genomic intervals (BED, GFF, VCF formats),
    enabling tasks like intersection, merge, complement, and coverage calculations across genomic regions.
    Supports operations on millions of intervals with high efficiency. AI agents can use BEDTools to identify
    overlapping features between datasets, calculate coverage statistics, merge adjacent intervals, find
    closest features, and perform complex genomic interval queries essential for ChIP-seq, ATAC-seq, and
    variant analysis workflows.
- name: Picard
  subtitle: null
  url: https://broadinstitute.github.io/picard/
  category: core ngs pipeline
  organization: Broad Institute
  summary: A suite of Java-based command-line tools for manipulating high-throughput sequencing data and
    formats, including SAM/BAM/CRAM, VCF, and various quality metrics. Key functions include marking PCR
    duplicates, collecting alignment metrics, fixing mate-pair information, and converting between file
    formats. AI agents can invoke Picard to mark duplicate reads before variant calling, validate BAM
    file integrity, collect comprehensive alignment and insert size metrics, and ensure data quality standards
    for GATK-based analysis pipelines.
- name: SPAdes
  subtitle: St. Petersburg genome Assembler
  url: https://github.com/ablab/spades
  category: genome assembly variant analysis
  organization: Center for Algorithmic Biotechnology, St. Petersburg State University
  summary: A versatile de novo genome assembler designed for small genomes (bacteria, fungi) using short-read
    Illumina data, with specialized modes for single-cell, metagenomic, plasmid, and RNA-seq assembly.
    Uses multi-sized de Bruijn graphs and built-in error correction to handle uneven coverage and sequencing
    errors. AI agents can invoke SPAdes for bacterial genome assembly tasks, automatically select assembly
    modes based on data type, iteratively optimize k-mer sizes, and integrate with downstream annotation
    pipelines.
- name: Flye
  subtitle: null
  url: https://github.com/fenderglass/Flye
  category: genome assembly variant analysis
  organization: Kolmogorov Lab
  summary: A long-read de novo assembler optimized for PacBio and Oxford Nanopore data, capable of assembling
    genomes ranging from bacterial to mammalian scale using repeat graph-based algorithms. Handles high
    error rates in raw long reads and produces accurate assemblies with excellent contiguity. AI agents
    can use Flye for long-read assembly workflows, automatically configure parameters based on coverage
    and read length, perform metagenomic assembly, and generate high-quality reference genomes for variant
    calling.
- name: Canu
  subtitle: null
  url: https://github.com/marbl/canu
  category: genome assembly variant analysis
  organization: Koren & Walenz Labs
  summary: A comprehensive long-read assembly toolkit for high-noise single-molecule sequencing (PacBio,
    Oxford Nanopore), featuring adaptive k-mer weighting, aggressive error correction, and optimized algorithms
    for large eukaryotic genomes. Includes modules for read correction, trimming, and assembly with support
    for distributed computing. AI agents can execute Canu for complex genome assembly projects, manage
    resource-intensive computations across HPC clusters, tune sensitivity parameters for repetitive regions,
    and produce chromosome-scale assemblies.
- name: QUAST
  subtitle: QUality ASsessment Tool
  url: https://github.com/ablab/quast
  category: genome assembly variant analysis
  organization: Center for Algorithmic Biotechnology
  summary: A comprehensive assembly quality evaluation tool that computes metrics including N50, misassemblies,
    genome fraction coverage, and gene completeness when reference genomes are available. Generates interactive
    HTML reports with visualizations and supports metagenomic assembly evaluation. AI agents can invoke
    QUAST to automatically assess assembly quality, compare multiple assembly strategies, identify potential
    misassemblies, and select optimal assembly parameters based on quantitative metrics.
- name: Bandage
  subtitle: Bioinformatics Application for Navigating De novo Assembly Graphs Easily
  url: https://github.com/rrwick/Bandage
  category: genome assembly variant analysis
  organization: Ryan Wick
  summary: A GUI-based visualization tool for exploring de Bruijn graphs and assembly graphs from tools
    like SPAdes and Velvet, enabling interactive inspection of graph structure, repeat regions, and assembly
    paths. Supports BLAST searches within graphs and custom graph coloring based on coverage or sequence
    identity. AI agents can leverage Bandage's command-line interface to generate assembly graph images,
    identify problematic regions in assemblies, visualize structural variants, and guide targeted assembly
    refinement.
- name: GATK
  subtitle: Genome Analysis Toolkit
  url: https://gatk.broadinstitute.org/
  category: genome assembly variant analysis
  organization: Broad Institute
  summary: The gold-standard toolkit for variant discovery from high-throughput sequencing data, implementing
    best-practice workflows for germline and somatic variant calling including SNPs, indels, and CNVs.
    Features include base quality score recalibration, variant quality score recalibration, and joint
    genotyping across cohorts. AI agents can execute GATK workflows for clinical-grade variant calling,
    automatically apply VQSR filtering, perform multi-sample joint calling for population studies, and
    integrate with downstream annotation tools for variant interpretation.
- name: bcftools
  subtitle: null
  url: http://samtools.github.io/bcftools/
  category: genome assembly variant analysis
  organization: Genome Research Ltd
  summary: A comprehensive toolkit for VCF/BCF file manipulation and variant calling, providing utilities
    for filtering, merging, annotating, and calling variants from aligned sequencing data. Features highly
    optimized algorithms for large-scale population genomics with support for multi-sample calling. AI
    agents can use bcftools for rapid variant calling on BAM files, perform complex VCF filtering operations,
    merge multi-sample VCFs, calculate population statistics, and extract specific variants or samples
    for downstream analysis.
- name: Manta
  subtitle: null
  url: https://github.com/Illumina/manta
  category: genome assembly variant analysis
  organization: Illumina
  summary: A structural variant (SV) caller designed to detect deletions, insertions, inversions, and
    translocations from paired-end sequencing data with high sensitivity and specificity. Uses paired
    and split-read evidence with local assembly refinement to accurately resolve breakpoints. AI agents
    can invoke Manta for detecting large genomic rearrangements, integrate SV calls with SNP/indel data
    for comprehensive variant analysis, identify cancer-related fusion genes, and prioritize pathogenic
    structural variants in clinical sequencing.
- name: FreeBayes
  subtitle: null
  url: https://github.com/freebayes/freebayes
  category: genome assembly variant analysis
  organization: Erik Garrison
  summary: A Bayesian genetic variant detector designed to find SNPs, indels, and complex variants in
    populations, featuring haplotype-based variant calling without requiring read realignment. Supports
    both diploid and polyploid genomes with flexible ploidy settings. AI agents can use FreeBayes for
    population-scale variant calling, detect complex multi-nucleotide polymorphisms, perform somatic mutation
    detection in cancer samples, and generate high-quality variant calls from targeted sequencing panels.
- name: Pindel
  subtitle: null
  url: https://github.com/genome/pindel
  category: genome assembly variant analysis
  organization: Wellcome Trust Sanger Institute
  summary: A pattern-growth approach to detect breakpoints of large deletions, medium-sized insertions,
    inversions, and tandem duplications using paired-end short reads. Excels at detecting mid-size indels
    (1bp-10kb) often missed by standard variant callers. AI agents can execute Pindel to complement GATK/bcftools
    calls with improved indel detection, identify pathogenic deletion/insertion variants in clinical exomes,
    and characterize complex structural rearrangements in cancer genomes.
- name: VEP
  subtitle: Variant Effect Predictor
  url: https://www.ensembl.org/vep
  category: genome assembly variant analysis
  organization: EMBL-EBI / Ensembl
  summary: The most comprehensive variant annotation tool that predicts functional consequences of genomic
    variants on genes, transcripts, and proteins, integrating 30+ prediction algorithms (SIFT, PolyPhen,
    CADD) and clinical databases (ClinVar, gnomAD). Available as web interface, command-line tool, or
    REST API with support for custom annotations. AI agents can invoke VEP to annotate VCF files with
    transcript consequences, retrieve population frequencies, predict deleteriousness scores, identify
    clinically relevant variants, and generate structured reports for variant interpretation.
- name: SnpEff
  subtitle: null
  url: https://pcingola.github.io/SnpEff/
  category: genome assembly variant analysis
  organization: Pablo Cingolani
  summary: A fast variant annotation and functional effect prediction tool that categorizes variants by
    impact (HIGH, MODERATE, LOW, MODIFIER) and provides gene-based annotations, amino acid changes, and
    codon degeneracy information. Supports 38,000+ genomes with pre-built databases. AI agents can use
    SnpEff for rapid batch variant annotation, prioritize high-impact variants, generate summary statistics
    of variant distributions across functional categories, and integrate with Galaxy workflows for automated
    variant analysis pipelines.
- name: ANNOVAR
  subtitle: null
  url: https://annovar.openbioinformatics.org/
  category: genome assembly variant analysis
  organization: Kai Wang Lab
  summary: A versatile variant annotation tool that integrates gene-based, region-based, and filter-based
    annotations from hundreds of databases including RefSeq, UCSC, dbSNP, 1000 Genomes, and custom datasets.
    Supports flexible custom database integration and table-based output formats. AI agents can execute
    ANNOVAR to annotate variants with multiple database sources, filter variants based on population frequency
    and predicted pathogenicity, generate tab-delimited reports for clinical review, and customize annotation
    workflows with disease-specific databases.
- name: DESeq2
  subtitle: null
  url: https://bioconductor.org/packages/DESeq2/
  category: transcriptomics expression analysis
  organization: Michael Love, Simon Anders, Wolfgang Huber
  summary: The most widely-used R/Bioconductor package for differential gene expression analysis from
    count data, implementing negative binomial generalized linear models with robust variance estimation
    and empirical Bayes shrinkage. Handles complex experimental designs with multiple factors and supports
    likelihood ratio tests for model comparisons. AI agents can execute DESeq2 to identify differentially
    expressed genes between conditions, automatically detect outliers, normalize count data accounting
    for library size and composition, generate publication-quality MA plots and volcano plots, and export
    results with adjusted p-values for downstream pathway analysis.
- name: edgeR
  subtitle: null
  url: https://bioconductor.org/packages/edgeR/
  category: transcriptomics expression analysis
  organization: Gordon Smyth Lab
  summary: A powerful R/Bioconductor package for differential expression analysis using empirical Bayes
    methods and generalized linear models, particularly effective for experiments with small sample sizes.
    Features quasi-likelihood F-tests and robust variance modeling for complex experimental designs. AI
    agents can use edgeR for differential expression analysis with limited replicates, perform multi-factor
    designs with interaction terms, conduct gene set testing with camera/roast methods, and integrate
    with limma-voom for RNA-seq data normalization and precision weighting.
- name: StringTie
  subtitle: null
  url: https://ccb.jhu.edu/software/stringtie/
  category: transcriptomics expression analysis
  organization: Johns Hopkins University Center for Computational Biology
  summary: A fast and efficient transcript assembler that reconstructs full-length transcripts from RNA-seq
    alignments, quantifies expression levels, and identifies novel isoforms and alternative splicing events.
    Uses network flow algorithms and optional reference-guided assembly for improved accuracy. AI agents
    can invoke StringTie to assemble transcripts de novo or with reference guidance, quantify gene and
    transcript-level expression simultaneously, detect novel splice junctions, merge assemblies across
    multiple samples, and generate count matrices compatible with DESeq2/edgeR.
- name: Salmon
  subtitle: null
  url: https://combine-lab.github.io/salmon/
  category: transcriptomics expression analysis
  organization: Rob Patro Lab
  summary: An ultra-fast transcript quantification tool that estimates abundance from RNA-seq reads without
    alignment, using dual-phase parallel inference and lightweight mapping for 10-100x speed improvement
    over traditional methods. Produces accurate TPM and estimated counts with uncertainty quantification.
    AI agents can execute Salmon for rapid transcript-level quantification, bypass time-consuming alignment
    steps, automatically detect and correct for sequence-specific biases, generate bootstrap samples for
    uncertainty estimation, and produce count matrices ready for differential expression analysis in minutes
    rather than hours.
- name: HTSeq
  subtitle: null
  url: https://htseq.readthedocs.io/
  category: transcriptomics expression analysis
  organization: Simon Anders Lab
  summary: A Python framework for processing high-throughput sequencing data, most commonly used via htseq-count
    for generating gene-level read counts from aligned BAM files with flexible feature assignment rules.
    Handles paired-end data and supports multiple overlap resolution modes. AI agents can use HTSeq to
    count reads overlapping genomic features from BAM files, apply different counting modes (union, intersection-strict,
    intersection-nonempty) based on experimental needs, process large BAM files efficiently, and generate
    count tables for downstream differential expression analysis.
- name: Scanpy
  subtitle: null
  url: https://scanpy.readthedocs.io/
  category: transcriptomics expression analysis
  organization: Theis Lab
  summary: A comprehensive Python toolkit for analyzing single-cell RNA-seq data, providing scalable implementations
    of preprocessing, clustering, trajectory inference, and visualization methods for datasets with millions
    of cells. Integrates with AnnData format and includes PAGA for topology inference. AI agents can execute
    Scanpy workflows to normalize and filter single-cell data, identify highly variable genes, perform
    dimensionality reduction (PCA, UMAP, t-SNE), cluster cells using Leiden/Louvain algorithms, infer
    developmental trajectories, identify marker genes, and visualize results with publication-ready plots.
- name: Seurat
  subtitle: null
  url: https://satijalab.org/seurat/
  category: transcriptomics expression analysis
  organization: Satija Lab
  summary: The most popular R toolkit for single-cell RNA-seq analysis, offering comprehensive workflows
    for QC, normalization, integration, clustering, and differential expression with over 100,000 citations.
    Version 5 introduces scalable on-disk analysis and improved multi-modal integration capabilities.
    AI agents can invoke Seurat to process 10X Genomics data, integrate multiple datasets using anchors
    or harmony, perform SCTransform normalization, identify cell types using reference-based annotation,
    analyze spatial transcriptomics with Visium, and generate interactive visualizations with customizable
    UMAP/t-SNE plots.
- name: Cell Ranger
  subtitle: null
  url: https://support.10xgenomics.com/single-cell-gene-expression/software/pipelines/latest/what-is-cell-ranger
  category: transcriptomics expression analysis
  organization: 10X Genomics
  summary: The official analysis pipeline for processing 10X Genomics single-cell and spatial transcriptomics
    data, handling demultiplexing, barcode processing, alignment, UMI counting, and cell calling with
    optimized algorithms for 10X chemistry. Outputs include feature-barcode matrices and quality metrics.
    AI agents can execute Cell Ranger to process raw BCL files from 10X experiments, automatically detect
    cell barcodes and UMIs, align reads to reference genomes, generate filtered gene-barcode matrices,
    aggregate multiple samples, and produce web-based QC summary reports for immediate quality assessment.
- name: scVI
  subtitle: Single-cell Variational Inference
  url: https://scvi-tools.org/
  category: transcriptomics expression analysis
  organization: Yosef Lab
  summary: A deep learning framework for probabilistic modeling of single-cell omics data using variational
    autoencoders, enabling batch correction, imputation, dimensionality reduction, and integration of
    multi-modal datasets (RNA, ATAC, protein). Includes models like scVI, scANVI for annotation transfer,
    and totalVI for multi-modal analysis. AI agents can leverage scVI to remove batch effects while preserving
    biological variation, impute dropout events, integrate datasets across technologies and species, perform
    probabilistic cell type annotation, and generate biologically meaningful low-dimensional embeddings
    for downstream analysis.
- name: scGPT
  subtitle: null
  url: https://scgpt.readthedocs.io/
  category: transcriptomics expression analysis
  organization: Cui Lab
  summary: A foundation model for single-cell biology that uses transformer architecture pre-trained on
    33 million cells, enabling zero-shot cell type annotation, gene network inference, perturbation prediction,
    and multi-batch integration. Learns generalizable gene representations across diverse cell types and
    tissues. AI agents can invoke scGPT for transfer learning on new datasets, predict gene expression
    changes under perturbations, annotate rare cell types without reference data, infer gene regulatory
    relationships, and perform cross-species or cross-tissue analysis leveraging pre-trained biological
    knowledge.
- name: Squidpy
  subtitle: null
  url: https://squidpy.readthedocs.io/
  category: transcriptomics expression analysis
  organization: Theis Lab
  summary: A Python toolkit for spatial molecular data analysis that extends Scanpy with methods for spatial
    statistics, tissue structure analysis, ligand-receptor interaction inference, and image feature extraction.
    Supports multiple spatial technologies including Visium, Slide-seq, and imaging-based methods. AI
    agents can use Squidpy to compute spatial neighbor graphs, identify spatially variable genes, perform
    spatial autocorrelation analysis, extract morphological features from H&E images using deep learning,
    infer cell-cell communication through ligand-receptor databases, and visualize spatial patterns with
    tissue context.
- name: Tangram
  subtitle: null
  url: https://tangram-sc.readthedocs.io/
  category: transcriptomics expression analysis
  organization: Regev Lab
  summary: A deep learning method for mapping single-cell or cell type signatures to spatial locations
    in tissues, enabling spatial deconvolution and cross-technology data integration. Uses neural network
    optimization to align gene expression profiles while preserving spatial coherence. AI agents can execute
    Tangram to map scRNA-seq data onto spatial transcriptomics slides, deconvolve cell type compositions
    at spatial locations, transfer annotations from single-cell atlases to spatial data, predict spatial
    locations of cell types not captured by spatial technology, and integrate multi-modal spatial datasets.
- name: STUtility
  subtitle: null
  url: https://ludvigla.github.io/STUtility_web_site/
  category: transcriptomics expression analysis
  organization: Lundeberg Lab
  summary: An R package for analyzing and visualizing spatially resolved transcriptomics data, particularly
    Visium, with tools for tissue detection, image alignment, spatial feature identification, and integration
    with Seurat. Provides interactive visualization of tissue sections with gene expression overlays.
    AI agents can invoke STUtility to align tissue images with spot coordinates, automatically detect
    tissue regions, identify spatially variable genes using spatial autocorrelation, perform region-based
    differential expression, integrate spatial data with scRNA-seq references, and generate publication-quality
    spatial plots with anatomical context.
- name: SPATA2
  subtitle: null
  url: https://themilolab.github.io/SPATA2/
  category: transcriptomics expression analysis
  organization: Kuppe Lab
  summary: An R framework for comprehensive spatial transcriptomics analysis with emphasis on trajectory
    inference, surface modeling, and interactive visualization of spatial patterns. Features advanced
    spatial statistics and dimensionality reduction tailored for tissue architecture. AI agents can use
    SPATA2 to infer spatial trajectories across tissue regions, model gene expression as continuous surfaces,
    identify spatial gradients and transition zones, perform spatial clustering with anatomical constraints,
    and create interactive 3D visualizations of gene expression landscapes in tissue context.
- name: Giotto
  subtitle: null
  url: https://giottosuite.readthedocs.io/
  category: transcriptomics expression analysis
  organization: Yuan Lab
  summary: A comprehensive toolbox for spatial transcriptomics and multiplexed imaging data analysis in
    both R and Python, offering methods for spatial statistics, cell proximity analysis, ligand-receptor
    interaction modeling, and spatial enrichment. Supports over 10 spatial data types including Visium,
    Slide-seq, MERFISH, and seqFISH. AI agents can execute Giotto to create spatial expression maps, perform
    spatial co-expression network analysis, identify spatial domains using hidden Markov random fields,
    calculate spatial enrichment scores for cell type interactions, infer intercellular communication
    patterns, and integrate multi-resolution spatial datasets.
- name: MACS2
  subtitle: Model-based Analysis of ChIP-Seq
  url: https://github.com/macs3-project/MACS
  category: epigenomics regulatory analysis
  organization: Tao Liu Lab
  summary: The most widely-used peak caller for ChIP-seq and ATAC-seq data, using dynamic Poisson distribution
    to model local biases and identify enriched regions with high sensitivity and specificity. Supports
    broad peak calling for histone marks and narrow peak calling for transcription factors. AI agents
    can invoke MACS2 to call peaks from treatment vs control BAM files, automatically estimate fragment
    size and background, detect broad domains for histone modifications, generate bedGraph and bigWig
    files for visualization, calculate fold enrichment and FDR values, and produce summit files for motif
    analysis.
- name: HOMER
  subtitle: Hypergeometric Optimization of Motif EnRichment
  url: http://homer.ucsd.edu/homer/
  category: epigenomics regulatory analysis
  organization: Christopher Benner
  summary: A comprehensive suite for motif discovery, ChIP-seq analysis, and genomic annotation that identifies
    enriched DNA sequence motifs in regulatory regions using optimized scoring algorithms. Includes tools
    for peak annotation, differential binding analysis, and histone modification analysis. AI agents can
    execute HOMER to discover de novo motifs in peak regions, annotate peaks with nearest genes and genomic
    features, find known motif instances across the genome, perform differential peak analysis between
    conditions, create tag directories for visualization, and generate comprehensive HTML reports with
    motif logos and enrichment statistics.
- name: MEME Suite
  subtitle: null
  url: https://meme-suite.org/
  category: epigenomics regulatory analysis
  organization: Timothy Bailey Lab
  summary: A collection of tools for motif discovery and analysis, including MEME for de novo motif finding,
    FIMO for scanning sequences with known motifs, and TOMTOM for motif comparison. Features advanced
    algorithms for gapped motifs and position-specific scoring matrices. AI agents can use MEME to discover
    ungapped or gapped motifs in DNA/protein sequences, scan genomes for motif occurrences with FIMO,
    compare discovered motifs against databases with TOMTOM, analyze motif spacing and orientation, perform
    motif enrichment analysis, and generate publication-quality sequence logos with statistical significance
    metrics.
- name: Bismark
  subtitle: null
  url: https://www.bioinformatics.babraham.ac.uk/projects/bismark/
  category: epigenomics regulatory analysis
  organization: Babraham Bioinformatics
  summary: A specialized aligner for bisulfite-treated sequencing data that maps reads and extracts DNA
    methylation information, handling both directional and non-directional libraries with support for
    paired-end reads. Performs simultaneous alignment and methylation calling with context-specific resolution
    (CpG, CHG, CHH). AI agents can invoke Bismark to align bisulfite-converted reads to reference genomes,
    extract methylation calls at single-base resolution, generate methylation reports with coverage statistics,
    perform deduplication for WGBS data, create bedGraph files for genome browser visualization, and quantify
    global methylation patterns across genomic contexts.
- name: deepTools
  subtitle: null
  url: https://deeptools.readthedocs.io/
  category: epigenomics regulatory analysis
  organization: Ramírez Lab
  summary: A comprehensive toolkit for exploring and visualizing deep-sequencing data, providing utilities
    for BAM file processing, normalization, heatmap generation, and quality control across ChIP-seq, ATAC-seq,
    and RNA-seq experiments. Features include multiBamSummary, plotHeatmap, and computeMatrix for creating
    publication-ready figures. AI agents can use deepTools to generate correlation plots between samples,
    create signal heatmaps around genomic features (TSS, gene bodies, peaks), compute coverage tracks
    with various normalization methods (RPKM, CPM, RPGC), assess fragment size distributions, perform
    GC-bias correction, and visualize genome-wide signal patterns with customizable color schemes.
- name: ATACseqQC
  subtitle: null
  url: https://bioconductor.org/packages/ATACseqQC/
  category: epigenomics regulatory analysis
  organization: Jianhong Ou, Julie Zhu
  summary: An R/Bioconductor package specifically designed for quality control and analysis of ATAC-seq
    data, assessing fragment size distribution, transcription start site enrichment, nucleosome positioning,
    and library complexity. Provides diagnostic plots for troubleshooting experimental issues. AI agents
    can execute ATACseqQC to evaluate ATAC-seq data quality by checking fragment size periodicity (nucleosome
    ladder), calculate TSS enrichment scores, visualize insert size distributions, assess promoter/enhancer
    enrichment, detect mitochondrial contamination, identify low-quality libraries requiring re-sequencing,
    and generate comprehensive QC reports with standardized metrics.
- name: ChromHMM
  subtitle: null
  url: http://compbio.mit.edu/ChromHMM/
  category: epigenomics regulatory analysis
  organization: Ernst & Kellis Lab
  summary: A hidden Markov model-based method for chromatin state discovery and characterization from
    histone modification ChIP-seq data, learning and annotating combinatorial chromatin states (promoters,
    enhancers, insulators, heterochromatin) genome-wide. Produces browser-ready tracks and emission/transition
    parameters. AI agents can invoke ChromHMM to learn chromatin state models from multiple histone marks,
    automatically segment genomes into functional states, compare chromatin landscapes across cell types
    or conditions, identify state transitions during differentiation, annotate enhancers and promoters
    based on chromatin signatures, and generate genome browser tracks showing predicted regulatory elements
    with biological interpretations.
- name: MOFA+
  subtitle: Multi-Omics Factor Analysis
  url: https://biofam.github.io/MOFA2/
  category: multi omics integration
  organization: Ricard Argelaguet, Britta Velten
  summary: A statistical framework for unsupervised integration of multi-omics data using group factor
    analysis, identifying latent factors that explain coordinated variation across transcriptomics, epigenomics,
    proteomics, and other molecular layers. Handles missing data and supports multi-group comparisons.
    AI agents can execute MOFA+ to integrate multi-modal single-cell data, identify shared and unique
    sources of variation across omics layers, perform variance decomposition to quantify each factor's
    contribution, cluster samples based on latent factors, impute missing values across incomplete datasets,
    and visualize coordinated molecular changes driving biological processes.
- name: Seurat V5
  subtitle: null
  url: https://satijalab.org/seurat/
  category: multi omics integration
  organization: Satija Lab
  summary: The latest version of Seurat featuring scalable multi-modal integration through bridge integration
    and sketch-based analysis for million-cell datasets, supporting simultaneous analysis of RNA, ATAC,
    protein, and spatial data. Introduces on-disk data storage and streamlined integration workflows.
    AI agents can invoke Seurat V5 to integrate datasets across technologies using bridge integration
    anchors, perform sketch-based analysis on very large datasets (>1M cells), analyze CITE-seq data with
    weighted nearest neighbor (WNN) graphs, map query datasets to reference atlases, integrate spatial
    and single-cell data, and leverage BPCells for memory-efficient processing of massive datasets.
- name: MultiVI
  subtitle: null
  url: https://docs.scvi-tools.org/en/stable/user_guide/models/multivi.html
  category: multi omics integration
  organization: Gayoso, Steier et al.
  summary: A deep generative model within scvi-tools for joint analysis of single-cell RNA-seq and ATAC-seq
    data, learning a unified latent representation that captures both gene expression and chromatin accessibility
    while accounting for technical noise and batch effects. Uses amortized inference for scalability.
    AI agents can use MultiVI to integrate paired or unpaired scRNA-seq and scATAC-seq datasets, infer
    joint cell embeddings capturing both modalities, impute missing modalities (predict gene expression
    from ATAC or vice versa), remove batch effects while preserving biological variation, perform differential
    accessibility and expression analysis jointly, and transfer cell type annotations across modalities.
- name: totalVI
  subtitle: null
  url: https://docs.scvi-tools.org/en/stable/user_guide/models/totalvi.html
  category: multi omics integration
  organization: Gayoso, Steier et al.
  summary: A probabilistic model for joint analysis of CITE-seq data (RNA + surface proteins) using variational
    autoencoders, modeling the technical characteristics of both modalities including protein background
    and RNA dropout events. Enables denoised protein quantification and integrated clustering. AI agents
    can execute totalVI to jointly analyze gene expression and protein abundance from CITE-seq experiments,
    remove protein background noise and ambient RNA contamination, generate denoised protein expression
    matrices, perform integrated clustering using both modalities, conduct differential expression analysis
    for genes and proteins simultaneously, and impute missing protein measurements in datasets lacking
    ADT data.
- name: LIGER
  subtitle: Linked Inference of Genomic Experimental Relationships
  url: https://github.com/welch-lab/liger
  category: multi omics integration
  organization: Joshua Welch Lab
  summary: An integrative non-negative matrix factorization (iNMF) framework for identifying shared and
    dataset-specific features across multi-modal single-cell datasets, particularly effective for integrating
    scRNA-seq, scATAC-seq, spatial transcriptomics, and DNA methylation data. Preserves biological variation
    while removing batch effects. AI agents can invoke LIGER to integrate diverse single-cell modalities
    using iNMF, identify shared metagene programs and dataset-specific factors, align datasets from different
    technologies or species, perform multi-dataset trajectory inference, integrate spatial and non-spatial
    data, quantify gene loading contributions across factors, and visualize integrated data with joint
    UMAP embeddings.
- name: Scissor
  subtitle: null
  url: https://github.com/sunduanchen/Scissor
  category: multi omics integration
  organization: Duan Chen Sun
  summary: A method for phenotype-associated single-cell subpopulation identification by correlating bulk
    tissue phenotypes (survival, drug response, clinical outcomes) with single-cell expression profiles
    using regularized regression. Bridges bulk genomics and single-cell data to identify disease-relevant
    cell populations. AI agents can execute Scissor to identify cell subpopulations associated with patient
    survival outcomes, link single-cell states to bulk tumor phenotypes, discover therapy-resistant cell
    populations from treatment response data, correlate cellular states with continuous clinical variables,
    prioritize cell types for therapeutic targeting based on phenotypic associations, and integrate TCGA
    bulk data with single-cell atlases for clinical insights.
- name: OpenMS
  subtitle: null
  url: https://www.openms.de/
  category: technology specific tools
  organization: OpenMS Team
  summary: A comprehensive open-source framework for mass spectrometry data analysis, providing tools
    for peak picking, feature detection, peptide identification, protein quantification, and metabolomics
    workflows. Supports multiple MS platforms and formats (mzML, mzXML) with TOPP tools for command-line
    processing. AI agents can execute OpenMS pipelines to process raw MS/MS data, perform label-free quantification,
    identify post-translational modifications, conduct targeted proteomics analysis with SRM/MRM data,
    integrate with database search engines (Mascot, X!Tandem), and generate standardized outputs for downstream
    statistical analysis.
- name: MaxQuant
  subtitle: null
  url: https://www.maxquant.org/
  category: technology specific tools
  organization: Jürgen Cox, Max Planck Institute
  summary: A widely-used quantitative proteomics software platform for analyzing large-scale MS data with
    Andromeda search engine, featuring label-free quantification (LFQ), isobaric labeling (TMT/iTRAQ),
    and match-between-runs for improved peptide identification. Includes Perseus for statistical analysis.
    AI agents can invoke MaxQuant to process Thermo, Bruker, and Sciex raw files, perform peptide identification
    with FDR control, quantify protein abundance across samples using LFQ or TMT, identify protein groups
    and isoforms, perform SILAC-based quantification, and export results to Perseus for differential expression
    analysis and pathway enrichment.
- name: ProteoWizard
  subtitle: null
  url: http://proteowizard.sourceforge.net/
  category: technology specific tools
  organization: Spielberg Family Center for Applied Proteomics
  summary: A suite of open-source tools for mass spectrometry data conversion and analysis, with msConvert
    for converting vendor-specific formats to open standards (mzML, mzXML) and tools for data filtering,
    peak picking, and quality control. Supports 30+ instrument vendors. AI agents can use ProteoWizard
    to convert proprietary MS formats (RAW, WIFF, .d) to open standards, apply spectral filters and centroiding
    during conversion, extract specific scan ranges or MS levels, perform batch conversion of large datasets,
    prepare data for downstream analysis in OpenMS/MaxQuant, and ensure data interoperability across proteomics
    platforms.
- name: QIIME2
  subtitle: Quantitative Insights Into Microbial Ecology
  url: https://qiime2.org/
  category: technology specific tools
  organization: Caporaso Lab
  summary: A comprehensive microbiome analysis platform for processing amplicon sequencing data (16S/18S/ITS),
    featuring plugin-based architecture for quality control, denoising with DADA2/Deblur, taxonomic classification,
    diversity analysis, and visualization. Supports reproducible workflows with artifact provenance tracking.
    AI agents can execute QIIME2 pipelines to denoise amplicon sequences into ASVs, assign taxonomy using
    trained classifiers (SILVA, Greengenes2), calculate alpha/beta diversity metrics, perform differential
    abundance testing with ANCOM-BC, generate interactive visualizations, conduct compositional data analysis,
    and integrate metadata for statistical testing of microbiome-phenotype associations.
- name: MetaPhlAn
  subtitle: Metagenomic Phylogenetic Analysis
  url: https://github.com/biobakery/MetaPhlAn
  category: technology specific tools
  organization: Huttenhower Lab
  summary: A computational tool for profiling microbial community composition from metagenomic shotgun
    sequencing using clade-specific marker genes, providing species-level taxonomic abundance without
    requiring assembly. Includes 1M+ markers from 100,000+ genomes in the latest mpa_vJan21 database.
    AI agents can invoke MetaPhlAn to rapidly profile taxonomic composition from WGS metagenomes, quantify
    relative abundances of bacteria, archaea, viruses, and eukaryotes, detect strain-level variation,
    merge profiles across samples for comparative analysis, integrate with HUMAnN for functional profiling,
    and generate abundance tables ready for statistical analysis.
- name: Kraken2
  subtitle: null
  url: https://github.com/DerrickWood/kraken2
  category: technology specific tools
  organization: Derrick Wood & Steven Salzberg
  summary: An ultrafast taxonomic classifier for metagenomic sequences using exact k-mer matches against
    a reference database, achieving classification speeds >100 times faster than previous methods while
    maintaining high accuracy. Supports custom database construction from RefSeq/GenBank. AI agents can
    execute Kraken2 to classify millions of reads in minutes, build custom databases for specific environments
    or pathogens, detect contamination in sequencing samples, identify microbes in clinical samples for
    pathogen detection, quantify taxonomic abundance with Bracken, and filter host-derived reads from
    metagenomic datasets.
- name: HUMAnN
  subtitle: HMP Unified Metabolic Analysis Network
  url: https://huttenhower.sph.harvard.edu/humann/
  category: technology specific tools
  organization: Huttenhower Lab
  summary: A pipeline for functional profiling of microbial communities from metagenomic sequencing, quantifying
    gene families, pathways, and metabolic potential using UniRef and MetaCyc databases. Integrates with
    MetaPhlAn for species-specific functional profiling. AI agents can invoke HUMAnN to profile metabolic
    pathways and gene family abundances, stratify functional contributions by organism, identify differentially
    abundant pathways between conditions, map to KEGG/MetaCyc/GO databases, normalize for sequencing depth
    and gene length, and generate pathway abundance tables for multi-omics integration.
- name: NanoPlot
  subtitle: null
  url: https://github.com/wdecoster/NanoPlot
  category: technology specific tools
  organization: Wouter De Coster
  summary: A visualization tool for quality control of long-read sequencing data from Oxford Nanopore
    and PacBio, generating comprehensive plots of read length distributions, quality scores, and yield
    statistics. Processes FASTQ, BAM, and sequencing summary files. AI agents can execute NanoPlot to
    assess long-read sequencing run quality, visualize read length N50 and distribution histograms, monitor
    quality scores over time during sequencing, identify failed pores or channels, compare multiple runs
    or barcodes, and generate publication-quality QC reports for evaluating library preparation and sequencing
    performance.
- name: Medaka
  subtitle: null
  url: https://github.com/nanoporetech/medaka
  category: technology specific tools
  organization: Oxford Nanopore Technologies
  summary: A neural network-based consensus tool for polishing draft genome assemblies from Oxford Nanopore
    reads, correcting systematic errors to improve base-level accuracy. Uses recurrent neural networks
    trained on specific basecaller versions and flowcell types. AI agents can invoke Medaka to polish
    draft assemblies after Flye/Canu, improve consensus accuracy to >99.9% for bacterial genomes, call
    variants from long-read alignments, select appropriate models based on basecaller version (Guppy/Dorado),
    perform iterative polishing rounds, and prepare assemblies for downstream annotation or comparative
    genomics.
- name: Racon
  subtitle: null
  url: https://github.com/lbcb-sci/racon
  category: technology specific tools
  organization: Vaser et al.
  summary: A rapid consensus module for polishing genome assemblies using long reads, employing partial
    order alignment (POA) graphs to correct errors in draft assemblies from noisy long-read data. Complements
    Medaka with faster but less accurate correction. AI agents can execute Racon for initial rapid polishing
    of draft assemblies, perform multiple polishing iterations to improve accuracy, integrate with minimap2
    for alignment-based polishing, process large eukaryotic genomes efficiently, combine with Medaka for
    hybrid polishing strategies, and prepare assemblies for downstream variant calling or structural analysis.
- name: Clair3
  subtitle: null
  url: https://github.com/HKU-BAL/Clair3
  category: technology specific tools
  organization: Luo et al.
  summary: A deep learning-based small variant caller for long-read sequencing (ONT, PacBio HiFi) using
    pileup and full-alignment networks to achieve high precision and recall for SNPs and indels. Supports
    germline and somatic variant calling with model selection based on sequencing platform. AI agents
    can invoke Clair3 to call SNPs and indels from long-read BAM files, automatically select platform-specific
    models (ONT R9/R10, PacBio HiFi), perform trio-based variant calling with parent genotypes, call somatic
    mutations in tumor samples, generate high-quality VCF files with confidence scores, and integrate
    with short-read data for hybrid variant calling strategies.
- name: miRDeep2
  subtitle: null
  url: https://github.com/rajewsky-lab/mirdeep2
  category: technology specific tools
  organization: Friedländer Lab
  summary: A probabilistic algorithm for discovering novel microRNAs from small RNA sequencing data by
    analyzing read depth patterns and secondary structure compatibility with Dicer processing. Quantifies
    known and novel miRNA expression across samples. AI agents can execute miRDeep2 to identify novel
    miRNAs from small RNA-seq data, quantify expression of known miRNAs from miRBase, predict precursor
    structures and mature sequences, score candidates based on Dicer processing signatures, filter false
    positives using probabilistic models, and generate lists of high-confidence novel miRNAs for experimental
    validation.
- name: sRNAbench
  subtitle: null
  url: https://bioinfo2.ugr.es/srnatoolbox/srnabench/
  category: technology specific tools
  organization: University of Granada
  summary: A comprehensive web-based and standalone tool for small RNA-seq analysis, providing read processing,
    annotation against multiple databases (miRBase, piRNABank, tRNAs), differential expression analysis,
    and isomiR detection. Supports multiple species and custom reference libraries. AI agents can invoke
    sRNAbench to process and map small RNA reads, annotate different RNA biotypes (miRNA, piRNA, tRNA
    fragments, snoRNA), identify isomiRs and RNA modifications, perform differential expression analysis
    between conditions, predict novel miRNAs, and generate comprehensive reports with expression profiles
    across RNA categories.
- name: rMATS
  subtitle: replicate Multivariate Analysis of Transcript Splicing
  url: http://rnaseq-mats.sourceforge.net/
  category: technology specific tools
  organization: Manabu Shen Lab
  summary: A computational tool for detecting differential alternative splicing from RNA-seq data, identifying
    and quantifying five major splicing event types (SE, MXE, A5SS, A3SS, RI) with statistical significance
    testing across biological replicates. Handles both paired and unpaired sample comparisons. AI agents
    can execute rMATS to detect alternative splicing events from STAR-aligned BAM files, quantify inclusion
    levels (PSI values) for each event type, perform statistical testing for differential splicing between
    conditions, filter events by coverage and FDR thresholds, visualize splicing patterns with sashimi
    plots, and identify splicing changes associated with disease or developmental transitions.
- name: SUPPA
  subtitle: Super-fast Pipeline for Alternative Splicing
  url: https://github.com/comprna/SUPPA
  category: technology specific tools
  organization: Eduardo Eyras Lab
  summary: A lightweight tool for alternative splicing analysis from transcript quantification (Salmon,
    Kallisto), calculating PSI values and detecting differential splicing across conditions without requiring
    alignment files. Supports local and transcript-level splicing analysis. AI agents can invoke SUPPA
    to generate splicing event libraries from GTF annotations, calculate PSI values from transcript TPM
    estimates, perform fast differential splicing analysis across hundreds of samples, cluster samples
    by splicing profiles, identify splicing outliers, and analyze both local events and global transcript
    usage changes.
- name: LeafCutter
  subtitle: null
  url: https://davidaknowles.github.io/leafcutter/
  category: technology specific tools
  organization: David Knowles & Jonathan Pritchard
  summary: An annotation-free method for detecting and quantifying intron excision events from RNA-seq
    data, discovering novel and complex splicing patterns by clustering introns sharing splice sites.
    Performs differential splicing analysis with linear mixed models. AI agents can execute LeafCutter
    to discover intron clusters from junction reads without GTF annotation, quantify intron excision ratios
    across samples, detect differential intron usage between conditions, identify cryptic splicing events
    and novel exons, perform QTL mapping for splicing variation (sQTL), and visualize complex splicing
    patterns with leafviz browser.
- name: AlphaFold
  subtitle: null
  url: https://alphafold.ebi.ac.uk/
  category: ai ml foundation models
  organization: DeepMind / Google
  summary: A revolutionary deep learning system for protein structure prediction that achieved near-experimental
    accuracy using transformer architecture and evolutionary information from multiple sequence alignments.
    AlphaFold2 database contains 200M+ predicted structures covering most known proteins. AI agents can
    invoke AlphaFold to predict 3D structures from amino acid sequences, access pre-computed structures
    from the database, estimate prediction confidence with pLDDT scores, identify intrinsically disordered
    regions, model protein complexes using AlphaFold-Multimer, and integrate predicted structures into
    drug discovery or protein engineering workflows.
- name: ESMFold
  subtitle: null
  url: https://esmatlas.com/
  category: ai ml foundation models
  organization: Meta AI
  summary: A language model-based protein structure prediction system trained on 250M+ protein sequences
    without requiring MSAs, enabling 60x faster prediction than AlphaFold while maintaining competitive
    accuracy. Uses ESM-2 protein language model embeddings for structure generation. AI agents can execute
    ESMFold to rapidly predict structures for orphan proteins lacking homologs, generate structures for
    metagenomic sequences, batch-process thousands of proteins efficiently, access the ESM Metagenomic
    Atlas with 600M+ predicted structures, predict structures for designed or mutated sequences, and integrate
    with protein design pipelines requiring fast iteration.
- name: RoseTTAFold
  subtitle: null
  url: https://github.com/RosettaCommons/RoseTTAFold
  category: ai ml foundation models
  organization: David Baker Lab
  summary: A three-track neural network for protein structure prediction combining 1D sequence, 2D distance
    maps, and 3D coordinate representations with attention mechanisms. Includes RoseTTAFold All-Atom for
    predicting structures with small molecules and modified residues. AI agents can invoke RoseTTAFold
    to predict protein structures with limited MSA depth, model protein-ligand complexes, predict structures
    with post-translational modifications, perform functional site prediction, integrate with Rosetta
    suite for structure refinement, and handle proteins with non-standard amino acids or cofactors.
- name: xTrimo
  subtitle: null
  url: https://github.com/biomap-research/xTrimo
  category: ai ml foundation models
  organization: BioMap Research
  summary: A multimodal foundation model pre-trained on genomic sequences, RNA secondary structures, and
    functional annotations, supporting tasks including variant effect prediction, regulatory element identification,
    RNA structure prediction, and gene expression forecasting. Uses transformer architecture with 1B+
    parameters. AI agents can invoke xTrimo to predict pathogenicity of genetic variants, identify regulatory
    elements in non-coding regions, forecast gene expression changes from sequence, predict RNA secondary
    structures, perform zero-shot transfer to new genomic tasks, and integrate sequence-based predictions
    with experimental data for variant prioritization.
- name: Nucleotide Transformer
  subtitle: null
  url: https://github.com/instadeepai/nucleotide-transformer
  category: ai ml foundation models
  organization: InstaDeep
  summary: A collection of genomic language models pre-trained on 3,202 diverse genomes using self-supervised
    learning, providing embeddings for DNA sequences that capture evolutionary and functional constraints.
    Models range from 50M to 2.5B parameters with context lengths up to 1000bp. AI agents can use Nucleotide
    Transformer to generate contextualized sequence embeddings, predict regulatory elements and promoters,
    identify functional variants, perform few-shot learning on limited datasets, transfer knowledge across
    species, fine-tune for specific genomic prediction tasks, and extract features for downstream machine
    learning models.
- name: DNABERT
  subtitle: null
  url: https://github.com/jerryji1993/DNABERT
  category: ai ml foundation models
  organization: Ji et al.
  summary: A BERT-based pre-trained model for DNA sequences using k-mer tokenization (k=3,4,5,6), capturing
    sequence patterns and motifs through bidirectional transformers. Pre-trained on human reference genome
    for genomic understanding tasks. AI agents can execute DNABERT to predict promoter regions and transcription
    factor binding sites, identify splice sites and polyadenylation signals, classify regulatory elements,
    perform motif discovery through attention visualization, fine-tune on specific genomic annotation
    tasks, and generate sequence representations for variant effect prediction.
- name: Geneformer
  subtitle: null
  url: https://huggingface.co/ctheodoris/Geneformer
  category: ai ml foundation models
  organization: Gladstone Institutes / Christina Theodoris
  summary: A transformer-based foundation model pre-trained on 30M single-cell transcriptomes from diverse
    tissues and cell types, learning context-specific gene network dynamics. Uses rank-based tokenization
    and attention mechanisms to capture gene-gene relationships. AI agents can invoke Geneformer to perform
    in silico perturbation predictions, identify disease-associated cell states, predict cell fate transitions,
    extract gene embeddings capturing functional relationships, perform few-shot cell type annotation,
    predict transcription factor targets, and model gene regulatory networks from expression data.
- name: scFoundation
  subtitle: null
  url: https://github.com/biomap-research/scFoundation
  category: ai ml foundation models
  organization: BioMap Research
  summary: A foundation model for single-cell biology pre-trained on 50M+ cells across multiple species
    and tissues using masked cell modeling, providing universal cell representations for diverse downstream
    tasks including cell type annotation, drug response prediction, and perturbation modeling. AI agents
    can execute scFoundation to annotate cell types with zero-shot learning, predict cellular responses
    to genetic or chemical perturbations, generate cell embeddings for clustering and visualization, perform
    cross-species cell type mapping, identify disease-relevant cell states, and integrate multi-modal
    single-cell data.
- name: UCE
  subtitle: Universal Cell Embeddings
  url: https://github.com/snap-stanford/UCE
  category: ai ml foundation models
  organization: Stanford SNAP Lab
  summary: A foundational model providing universal representations for single cells by pre-training on
    36M cells from human and mouse tissues, enabling robust cell type identification and biological discovery
    across datasets. Uses contrastive learning and masked cell prediction. AI agents can invoke UCE to
    generate high-quality cell embeddings for any scRNA-seq dataset, perform reference-free cell type
    annotation, identify novel cell states, integrate datasets across batches and technologies, predict
    cell-cell relationships, build cell atlases with consistent embeddings, and enable few-shot learning
    for rare cell types.
- name: DiffDock
  subtitle: null
  url: https://github.com/gcorso/DiffDock
  category: ai ml foundation models
  organization: Corso et al. / MIT
  summary: A diffusion-based model for molecular docking that predicts protein-ligand binding poses using
    geometric deep learning, achieving state-of-the-art accuracy while being 1000x faster than traditional
    docking methods. Generates multiple diverse binding poses with confidence estimates. AI agents can
    execute DiffDock to predict ligand binding poses for drug discovery, screen virtual compound libraries
    rapidly, generate diverse binding mode hypotheses, estimate binding confidence without computationally
    expensive scoring, integrate with molecular dynamics for pose refinement, and prioritize compounds
    for experimental validation.
- name: EquiBind
  subtitle: null
  url: https://github.com/HannesStark/EquiBind
  category: ai ml foundation models
  organization: Stärk et al. / MIT
  summary: A geometric deep learning framework for fast and accurate blind protein-ligand docking using
    equivariant graph neural networks, predicting binding poses directly without requiring pocket specification
    or docking scoring functions. Provides uncertainty quantification for predictions. AI agents can invoke
    EquiBind to perform rapid ligand docking without predefined binding sites, screen large compound libraries
    efficiently, predict binding poses for flexible ligands, generate initial poses for molecular dynamics
    simulations, integrate with downstream binding affinity prediction, and enable high-throughput virtual
    screening workflows.
- name: RFdiffusion
  subtitle: null
  url: https://github.com/RosettaCommons/RFdiffusion
  category: ai ml foundation models
  organization: David Baker Lab
  summary: A diffusion-based generative model for de novo protein design that creates protein backbones
    with desired shapes, functions, or binding properties using denoising diffusion probabilistic models
    trained on protein structures. Enables design of binders, enzymes, and scaffolds. AI agents can execute
    RFdiffusion to design proteins with specified geometries, generate binders for target proteins, create
    enzyme scaffolds for desired active sites, design symmetric protein assemblies, produce motif-scaffolding
    proteins, inpaint protein regions while preserving function, and integrate with ProteinMPNN for sequence
    design to create novel functional proteins.
- name: IGV
  subtitle: Integrative Genomics Viewer
  url: https://igv.org/
  category: visualization exploration
  organization: Broad Institute
  summary: A high-performance genome browser for interactive visualization of diverse genomic data types
    including alignments (BAM/CRAM), variants (VCF), coverage tracks, gene annotations, and ChIP-seq peaks.
    Supports real-time navigation across reference genomes with synchronized multi-track views. AI agents
    can invoke IGV to visually inspect variant calls and alignment quality, validate structural variants
    and splice junctions, examine read depth and coverage patterns, visualize epigenetic modifications
    and regulatory elements, generate publication-ready screenshots of genomic regions, integrate multiple
    data tracks for comprehensive variant interpretation, and perform batch processing for automated snapshot
    generation.
- name: Loupe Browser
  subtitle: null
  url: https://www.10xgenomics.com/support/software/loupe-browser
  category: visualization exploration
  organization: 10X Genomics
  summary: An interactive desktop application for exploring single-cell and spatial transcriptomics data
    from 10X Genomics platforms, providing intuitive visualization of clusters, gene expression, and spatial
    tissue architecture. Includes tools for differential expression, pathway enrichment, and cell type
    annotation. AI agents can guide users to explore Cell Ranger outputs in Loupe, interactively define
    cell populations and subclusters, visualize gene expression overlays on tissue images for Visium data,
    perform on-the-fly differential expression analysis, annotate cell types with custom markers, export
    high-resolution images for publications, and compare expression patterns across spatial regions or
    experimental conditions.
- name: cellxgene
  subtitle: null
  url: https://cellxgene.cziscience.com/
  category: visualization exploration
  organization: Chan Zuckerberg Initiative
  summary: A web-based interactive explorer for single-cell transcriptomics data that enables dynamic
    visualization, gene expression queries, and cell subset selection through an intuitive interface.
    Serves as both a data portal (CZ CELLxGENE Discover with 50M+ cells) and local visualization tool.
    AI agents can deploy cellxgene to provide interactive data exploration for collaborators, visualize
    AnnData objects with UMAP/t-SNE projections, dynamically color cells by gene expression or metadata,
    select and export cell subsets for re-analysis, integrate with computational notebooks, host datasets
    for publication sharing, and enable researchers to explore single-cell atlases without programming
    expertise.
- name: Napari
  subtitle: null
  url: https://napari.org/
  category: visualization exploration
  organization: Napari Community
  summary: A fast, multi-dimensional image viewer for Python designed for visualizing and analyzing large
    biological imaging datasets including microscopy, spatial transcriptomics imaging, and volumetric
    data. Features GPU-accelerated rendering and extensible plugin architecture. AI agents can invoke
    Napari to visualize spatial transcriptomics H&E images alongside gene expression, display multi-channel
    fluorescence microscopy with custom colormaps, perform manual annotation and segmentation of cells/nuclei,
    integrate deep learning models for automated image analysis, create 3D visualizations of volumetric
    imaging data, prototype image processing workflows interactively, and develop custom plugins for specialized
    imaging tasks.
