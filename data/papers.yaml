  title: Benchmarking Large Language Models for Replication of Guideline-Based PGx Recommendations
  url: https://www.nature.com/articles/s41397-025-00383-0
  year: 2025
  venue: The Pharmacogenomics Journal
  summary: This study assesses how well large language models can generate clinically accurate pharmacogenomic
    (PGx) recommendations aligned with CPIC guidelines. Using 599 curated gene–drug–phenotype scenarios
    and a novel expert-validated semantic metric (LLM Score), the authors show that general-purpose LLMs
    often produce incomplete or unsafe recommendations. In contrast, a domain-adapted, fine-tuned model
    achieves substantially better accuracy (LLM Score = 0.92) and faster inference. The results emphasize
    that fine-tuning and structured prompting are more critical than model scale alone for safe, effective
    AI-driven personalized medicine.
