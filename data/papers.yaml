  title: 'Boosting GPT Models for Genomics Analysis: Generating Trusted Genetic Variant Annotations and
    Interpretations through RAG and fine-tuning'
  url: https://academic.oup.com/bioinformaticsadvances/article-abstract/5/1/vbaf019/8002096
  doi: 10.1093/bioadv/vbaf019
  year: 2025
  venue: Bioinformatics Advances
  summary: This study aims to enhance large language model performance in genomics by incorporating large-scale
    variant annotation data using retrieval-augmented generation (RAG) and fine-tuning. By integrating
    190 million curated variant annotations from five major datasets into GPT-4o, the system enables accurate,
    reasoning-supported variant queries and interpretations. Results show that while fine-tuning improves
    performance in some annotation fields, RAG is more effective overall in terms of scalability, accuracy,
