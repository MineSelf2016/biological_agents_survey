- id: improving-automated-deep-phenotyping-through-2025
  title: Improving Automated Deep Phenotyping Through Large Language Models Using Retrieval Augmented
    Generation
  url: https://link.springer.com/article/10.1186/s13073-025-01521-w
  doi: 10.1186/s13073-025-01521-w
  date: '2025-08-18'
  year: 2025
  venue: Genome Medicine
  summary: This paper introduces RAG-HPO, a retrieval-augmented generation tool that improves automatic
    extraction and assignment of Human Phenotype Ontology (HPO) terms from clinical text. By combining
    LLM-based phrase extraction with real-time retrieval from a large vector database of phenotype–HPO
    mappings, RAG-HPO reduces hallucinations and avoids costly fine-tuning. Evaluated on 112 rare-disease
    case reports, it significantly outperforms existing HPO extraction tools in precision, recall, and
    F1 score, with most false positives being clinically relevant ancestor terms rather than hallucinations.
    The results demonstrate that RAG-based grounding enables accurate, reliable phenotype extraction for
    clinical genomics and rare disease diagnosis.
