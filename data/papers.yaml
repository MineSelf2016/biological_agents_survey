- id: consistent-performance-of-gpt-2025
  title: Consistent Performance of GPT-4o in Rare Disease Diagnosis Across Nine Languages and 4967 Cases
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11888497/
  year: 2025
  venue: medRxiv
  summary: This study evaluates the ability of GPT-4o to perform differential diagnosis for rare genetic
    diseases across nine languages using nearly 5,000 structured clinical vignettes derived from HPO-annotated
    phenotypes. Using zero-shot prompting and ontology-based automated evaluation, the model achieved
    comparable performance across English and eight non-English languages, ranking the correct diagnosis
    first in about 17–21% of cases and within the top three in about 25–28%. The consistency of results
    across languages suggests that language barriers may not substantially degrade LLM-based diagnostic
    reasoning. Overall, the findings indicate that LLMs like GPT-4o have potential utility for differential
    diagnosis support in non-English clinical settings.
