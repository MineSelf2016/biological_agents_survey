  date: '2023-06-06'
  year: 2023
  venue: Arxiv
  summary: Large language models are accelerating and democratizing research by providing accessible expertise
    across disciplines, but they also risk lowering barriers to dual use technologies with serious biosecurity
    implications. An educational experiment showed that, with minimal prompting, chatbots could guide
    non experts through key steps related to pandemic scale agents, indicating that such capabilities
