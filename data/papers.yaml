  venue: IEEE EMBC
  summary: This study examines whether large language models (LLMs) can capture the full spectrum of human
    reasoning, including both fast, intuitive System 1 and slow, deliberative System 2 processes. Using
    a generalized Natural Language Inference task and crowdsourced human response distributions, the authors
    evaluate LLMs’ ability to reproduce not just majority answers but the full diversity of human judgments.
    They introduce personality-based prompting inspired by the Big Five model, optimized with genetic
    algorithms, to elicit diverse reasoning styles from LLMs. Results show that this approach significantly
    improves alignment with human response distributions, with open-source models outperforming proprietary
