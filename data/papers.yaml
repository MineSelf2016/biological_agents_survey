- id: rna-2024
  title: 'RNA-GPT: Multimodal Generative System for RNA Sequence Understanding'
  url: https://arxiv.org/abs/2411.08900
  year: 2024
  venue: arXiv
  summary: This paper introduces **RNA-GPT**, a multimodal RNA-focused language model designed to support
    RNA research by integrating RNA sequence encoders with large language models. RNA-GPT aligns RNA sequence
    representations with textual knowledge, enabling it to process user-provided RNA sequences and answer
    complex RNA-related queries accurately. The system is trained using RNA-QA, an automated pipeline
    that extracts and organizes RNA annotations from RNACentral to generate large-scale instruction-tuning
    data. Experiments show that RNA-GPT effectively facilitates RNA discovery, supported by a curated
    dataset of over 400,000 RNA samples for modality alignment and instruction tuning.
