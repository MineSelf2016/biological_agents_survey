  url: https://onlinelibrary.wiley.com/doi/abs/10.1111/ctr.70026
  year: 2024
  venue: Clinical Transplantation
  summary: This study explores attitudes toward using the Gia® genetic information chatbot to support
    APOL1 testing among living kidney donor candidates of African ancestry. Through focus groups and surveys
    involving donors, recipients, and community members, participants generally supported using the chatbot
    prior to clinical visits and expressed interest in APOL1 testing, though concerns about cost, personal
    preferences, and individual barriers emerged. Overall, participants were receptive to integrating
